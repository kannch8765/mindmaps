# 🧬 Edge et al. 2021<br>Why Li-ion batteries degrade

## 🔋 0 · Cell basics
- **Parts**
  - Positive electrode (PE): NMC, LFP…
  - Negative electrode (NE): graphite (+Si)
  - Electrolyte + separator
  - Current collectors
- **Charge**: Li⁺ PE → NE, e⁻ via external circuit
- **SOC** ≠ **SOH**
  - SOC = how charged now
  - SOH = capability vs reference
- **Capacity** (Ah) vs **Power** (impedance-limited)

## 🎯 1 · Three levels (same event!)
- **Mechanism**: what happened inside?
  - e.g. SEI grows
  - hard to confirm directly
- **Mode**: how did electrochemistry change?
  - e.g. LLI
  - inferred by electrical diagnostics
- **Effect**: what the user sees
  - e.g. less Ah, power fade
  - easiest to measure
- ⚠️ mapping is **many-to-many**

## ⚗️ 3 · Five principal mechanisms
- **A. SEI growth** (NE)
  - protective skin at formation
  - more growth eats Li + electrolyte
  - ↑ high T, high SOC rest, cracks, TM deposits
  - → LLI, impedance
- **B. Li plating** (NE)
  - Li deposits *on* graphite, not *in*
  - ↑ fast charge, low T, high SOC
  - dead Li, dendrites → short risk
  - → LLI, impedance
- **C. PE structural change**
  - layered → spinel / rock-salt
  - lattice O₂ release, gas
  - TM (Ni/Mn/Co) dissolution → migrates to NE
  - Ni/Li cation mixing
  - acid / HF attack, CEI films
  - → LAM-PE, impedance (+LLI)
- **D. NE particle fracture**
  - expansion/contraction stress
  - Si: huge volume change
  - fresh surface → new SEI
  - → LAM-NE, impedance, LLI
- **E. PE particle fracture**
  - nonuniform lithiation strain
  - → LAM-PE, impedance

## 📉 2 · Five degradation modes
- **LLI**: lost cyclable lithium
  - "fewer tokens to shuttle"
  - clue: ICA/DVA shift, coulombic loss
- **LAM-NE**: lost NE storage sites
- **LAM-PE**: lost PE storage sites
- **Stoichiometric drift**
  - electrode windows misaligned
  - can push PE to high potential
- **Impedance change**
  - ohmic ↑ + slower kinetics
  - clue: EIS, HPPC / DCIR

## 🔁 4–5 · Coupling & feedback
- **13 secondary mechanisms** (Fig. 9)
  - dead Li, electrolyte dry-out
  - SEI crack & reform
  - TM cross-over
- **Positive feedback** loops
  - crack → fresh surface → SEI → LLI
  - pore blockage → plating → more SEI
  - TM dissolution → NE SEI ↑
- **Negative feedback**
  - thick SEI slows own growth
  - LLI can suppress plating
- **Path dependence**: order matters
- **Knee**: no single universal cause

## 🌡️ 6 · Stressors (Table 3)
- **Low T** → plating, fracture
- **High T** → SEI, PE phase change, TM dissolution
- **High SOC / V** → nearly everything
- **High current** → plating, fracture
- ⚠️ trends, not on/off thresholds
- ⚠️ internal moisture ≠ ambient humidity

## 🔬 7 · Diagnostics
- **Capacity test** → Ah fade (not cause)
- **Pulse / HPPC / DCIR** → power limit
- **EIS** → impedance parts (needs model)
- **OCV + ICA / DVA** → estimate LLI / LAM
- **HP coulometry** → tiny side-reaction losses
- **XRD / SEM / XCT** → direct physical evidence
- 💡 *inference ≠ identification*

## 🧮 8 · Modelling
- **ECM / empirical**: fast, BMS-ready, regime-dependent
- **P2D / DFN**: physics, explains, heavy
- **SPM / hybrid**: middle ground
- **Coupled models**: SEI + plating, cracks + films…
- **ML**: needs good data + physics context
