<script>
// Shared glossary for all battery-paper graphs. term = shown name; aka = other spellings matched in card text;
// cs = case-sensitive match (for short abbreviations that clash with ordinary words).
window.GLOSSARY_BASE = [
  // ── battery basics
  { term: "SoH", aka: ["SOH", "state of health", "state-of-health"], def: "State of health: how much capability a battery keeps, usually measured capacity ÷ a reference capacity (rated or first-cycle). Only meaningful together with its reference and test conditions." },
  { term: "SOC", aka: ["SoC", "state of charge"], def: "State of charge: how full the battery is right now, as a % of its current capacity. Not the same as SoH: a worn battery can be 100% full." },
  { term: "RUL", aka: ["remaining useful life"], def: "Remaining useful life: how many cycles or years are left before the battery reaches its end-of-life threshold." },
  { term: "EOL", aka: ["end of life", "end-of-life"], def: "End of life: the point where a battery is retired from its job; for EVs often defined as 80% of nominal capacity." },
  { term: "C-rate", aka: ["C rate"], def: "Current relative to capacity: 1C fully charges/discharges in about 1 hour, 2C in about 30 minutes, 0.5C in about 2 hours." },
  { term: "Capacity fade", aka: ["capacity loss"], def: "Loss of the charge (Ah) a battery can store; the most common health signal." },
  { term: "Power fade", def: "Loss of how fast a battery can deliver energy, mainly from rising internal resistance." },
  { term: "Impedance", aka: ["internal resistance", "resistance growth"], def: "Opposition to current inside the cell. Higher impedance = more voltage drop, more heat, less power." },
  { term: "OCV", aka: ["open-circuit voltage"], def: "Open-circuit voltage: the cell voltage at rest with no current; linked to SOC." },
  { term: "PE", cs: true, def: "Positive electrode (the cathode during discharge), e.g. NMC, LFP." },
  { term: "NE", cs: true, def: "Negative electrode (the anode during discharge), usually graphite, sometimes with silicon." },
  { term: "NMC", def: "Lithium nickel manganese cobalt oxide cathode: high energy, common in EVs." },
  { term: "LFP", def: "Lithium iron phosphate cathode: cheaper, safer and longer-lived, lower energy density." },
  { term: "LMO", def: "Lithium manganese oxide cathode: low cost, good power, shorter life." },
  { term: "NCA", def: "Lithium nickel cobalt aluminium oxide cathode: high energy (used e.g. in some Tesla cells)." },
  { term: "LCO", def: "Lithium cobalt oxide cathode: common in phones and laptops." },
  { term: "Cell / module / pack", aka: ["module", "modules", "pack", "packs"], def: "Cell = one battery unit; module = a group of connected cells; pack = modules plus electronics and cooling, as installed in a vehicle." },
  { term: "Calendar ageing", aka: ["calendar aging"], def: "Degradation while the battery rests, driven by time, temperature and SOC." },
  { term: "Accelerated ageing", aka: ["accelerated aging", "accelerated test", "accelerated tests"], def: "Lab tests with harsher conditions (heat, high current) to age cells faster. Can create failure modes that real use doesn't." },
  { term: "Cell-to-cell variation", aka: ["cell-to-cell", "cell variation"], def: "Nominally identical cells age differently because of small manufacturing and usage differences." },
  { term: "Second life", aka: ["second-life", "reuse", "repurposing", "repurposed"], def: "Reusing a retired EV battery in a gentler job (e.g. stationary storage) before recycling it." },
  { term: "Battery passport", aka: ["passport", "passports"], def: "A digital record of a battery's identity, materials and health. Required by the EU Battery Regulation 2023/1542 for EV and large industrial batteries from 2027." },
  { term: "Regrouping", aka: ["regroup"], def: "Combining retired cells or modules with similar health into new packs, so one weak cell doesn't limit the group." },
  { term: "Pyro / hydro / direct recycling", aka: ["pyrometallurgy", "hydrometallurgy", "direct recycling", "pyro", "hydro"], def: "Pyrometallurgy = smelting; hydrometallurgy = dissolving metals with chemicals; direct recycling = repairing the cathode material while keeping its structure." },

  // ── degradation
  { term: "SEI", aka: ["solid electrolyte interphase"], def: "Solid electrolyte interphase: a thin film on the negative electrode. It protects the cell but keeps growing, consuming lithium and electrolyte." },
  { term: "Lithium plating", aka: ["plating"], def: "Lithium metal deposits on the electrode surface instead of entering it; favoured by fast charging, cold and high SOC. Can grow dendrites." },
  { term: "LLI", aka: ["loss of lithium inventory", "lost lithium"], def: "Loss of lithium inventory: less cyclable lithium left to shuttle between electrodes." },
  { term: "LAM", aka: ["LAM-NE", "LAM-PE", "loss of active material"], def: "Loss of active material: electrode material that can no longer store lithium (cracked, isolated or degraded); -NE / -PE says which electrode." },
  { term: "Knee", aka: ["knee point", "knees", "knee-point"], def: "The point where capacity fade suddenly speeds up after a slower phase." },
  { term: "Resistance elbow", aka: ["elbow"], def: "The point where resistance starts rising fast; usually appears with or after the capacity knee." },
  { term: "Degradation mode", aka: ["degradation modes", "mode diagnosis"], def: "What electrical tests can infer (LLI, LAM, resistance), as opposed to the chemical mechanism behind it." },

  // ── tests
  { term: "CCCV", aka: ["CC-CV", "constant current constant voltage"], def: "Constant current, then constant voltage: the standard, slow (hours) way to measure true capacity." },
  { term: "HPPC", aka: ["hybrid pulse power characterization"], def: "Hybrid pulse power characterisation: a standard sequence of current pulses at several SOC levels to measure resistance and power. Slow when run in full." },
  { term: "Pulse test", aka: ["pulse", "pulses", "pulse injection", "short pulse"], def: "A few milliseconds to seconds of current; the voltage response reveals resistance and health. Fast and non-destructive." },
  { term: "DCIR", aka: ["direct-current internal resistance"], def: "Direct-current internal resistance, computed from the voltage drop during a current pulse." },
  { term: "EIS", aka: ["electrochemical impedance spectroscopy", "impedance spectroscopy"], def: "Electrochemical impedance spectroscopy: small AC signals at many frequencies; separates resistance contributions but needs a model to interpret." },
  { term: "ICA / DVA", aka: ["ICA", "DVA", "dQ/dV", "dV/dQ", "incremental capacity"], def: "Incremental capacity (dQ/dV) and differential voltage (dV/dQ) analysis: peaks in slow charge curves shift as lithium or active material is lost, so LLI and LAM can be estimated." },
  { term: "Coulometry", aka: ["HP coulometry", "coulombic efficiency"], def: "Precise counting of charge in vs out; small losses each cycle reveal side reactions." },

  // ── ML & statistics
  { term: "MAPE", aka: ["mean absolute percentage error"], def: "Mean absolute percentage error: average |error| ÷ true value. 5% MAPE on SoH 0.80 ≈ ±0.04." },
  { term: "RMSE", aka: ["RMSPE", "root mean square error"], def: "Root mean square (percentage) error: like an average error, but punishes large errors more." },
  { term: "MAE", aka: ["mean absolute error"], def: "Mean absolute error: the average size of the errors, in the target's units." },
  { term: "R²", aka: ["R2", "R^2"], def: "Coefficient of determination: share of the variation explained by a fit (1 = perfect)." },
  { term: "OOD", aka: ["out-of-distribution", "domain shift"], def: "Out-of-distribution: test data come from conditions the model never saw in training (e.g. a new SOC or chemistry), so accuracy can drop." },
  { term: "Interpolation / extrapolation", aka: ["interpolation", "extrapolation", "interpolate", "extrapolate"], def: "Predicting inside the range of training conditions (interpolation) vs outside it (extrapolation, much harder)." },
  { term: "VAE", aka: ["variational autoencoder", "autoencoder"], def: "Variational autoencoder: a generative model that compresses data into a small random 'latent' code and learns to decode new, realistic samples from it." },
  { term: "Latent space", aka: ["latent"], def: "The compressed internal representation a model learns; nearby points decode to similar data." },
  { term: "Cross-attention", aka: ["attention"], def: "A neural-network layer that lets one input (e.g. pulse features) focus on the parts of another input (e.g. SOC condition) that matter." },
  { term: "Random forest", aka: ["RF"], def: "An ensemble of decision trees whose predictions are averaged; strong on tabular features, but its uncertainty estimates can be over-confident." },
  { term: "Gaussian process", aka: ["GPR", "GP regression"], def: "A Bayesian regression method that gives a prediction plus a principled uncertainty band; slow on large data." },
  { term: "Bayesian ridge", aka: ["BRR"], def: "Linear regression with a Bayesian prior on the weights; simple, gives uncertainty." },
  { term: "Ensemble", aka: ["deep ensemble", "ensembles"], def: "Several models trained separately and combined; their disagreement gives an uncertainty estimate." },
  { term: "Calibration", aka: ["calibrated", "over-confident", "overconfident"], def: "A model is well calibrated if its 90% intervals contain the truth about 90% of the time. Over-confident = intervals too narrow." },
  { term: "Confidence interval", aka: ["confidence bounds", "uncertainty band"], def: "A range around a prediction that should contain the true value with a stated probability." },
  { term: "Feature engineering", aka: ["features", "feature extraction", "feature selection"], def: "Turning raw signals (e.g. voltage curves) into a few informative numbers a model can use; selection keeps only the useful ones." },
  { term: "Adversarial examples", aka: ["adversarial", "FGSM"], def: "Slightly perturbed inputs used in training to make a model robust to small changes (FGSM = fast gradient sign method)." },
  { term: "Transfer learning", aka: ["domain adaptation"], def: "Reusing a model trained on one dataset/condition for another, with little new data." },
  { term: "Synthetic data", aka: ["generated data", "data augmentation", "augmentation"], def: "Data produced by a model or simulation instead of measured; useful for training but not a real measurement." },
  { term: "Physics-based model", aka: ["physics-based", "P2D", "SPM", "electrochemical model"], def: "A model built from battery physics and chemistry equations; explains behaviour but is hard to parameterise." },
  { term: "Empirical model", aka: ["empirical"], def: "A curve fitted to observed ageing data (e.g. fade vs time and temperature) without modelling the internal physics." },
  { term: "Hybrid model", aka: ["hybrid approach", "hybrid approaches", "hybrids", "physics-informed", "physics + ML"], def: "Combines physics-based and data-driven (ML) parts, aiming for accuracy plus generalisation." },
  { term: "Federated learning", aka: ["federated"], def: "Training one model across several sites without sharing their raw data." },
  { term: "KL divergence", aka: ["Kullback-Leibler"], def: "A measure of how different two probability distributions are (0 = identical)." },
];

</script>
<script>
// Battery ageing map: Edge et al. 2021 (journal pages, PCCP 23, 8200–8221) × Attia et al. 2022 (arXiv v1 PDF pages).
// Knee types (Attia Fig. 6, p. 14): ❄️ snowball · 🙈 hidden · 🚪 threshold.
const COLS = [
  { key:"mech", title:"① Mechanisms", hint:"what happens inside (Edge)", color:"#d9485f", tint:"#fdecef" },
  { key:"sec",  title:"② Secondary mechanisms", hint:"knock-on effects (Edge Fig. 9)", color:"#e8833a", tint:"#fdf0e5" },
  { key:"mode", title:"③ Degradation modes", hint:"what electrical tests can infer", color:"#3e7cb1", tint:"#e8f0f8" },
  { key:"path", title:"④ Knee pathways", hint:"how fade suddenly speeds up (Attia)", color:"#7a5cc2", tint:"#f0ebfa" },
  { key:"eff",  title:"⑤ Effects", hint:"what the user sees", color:"#2f8f5b", tint:"#e7f4ec" },
];
const N = [
  // ① mechanisms
  { id:"sei", col:0, row:0, icon:"🧪", title:"SEI growth", sub:"Mechanism · negative electrode", papers:["Edge","Attia"],

    src:["Edge p. 8203 (SEI layer growth)","Edge Table 3, p. 8212 (stressors)","Attia p. 4 (sublinear, self-passivating)"] },
  { id:"plating", col:0, row:1.25, icon:"⚡", title:"Lithium plating", sub:"Mechanism · negative electrode", papers:["Edge","Attia"],

    note:"Lithium deposits ON the graphite instead of going IN. Leaves dead lithium, grows dendrites, and can short the cell.",

  { id:"pestruct", col:0, row:2.75, icon:"🧱", title:"PE structural change", sub:"Mechanism · positive electrode", papers:["Edge"],
    chips:["🌡️ High T","🔋 High SOC / V"],
    note:"Layered structure turns spinel/rock-salt, lattice oxygen and gas are released, Ni/Li mix, acid/HF attacks, CEI films form.",

  { id:"nefrac", col:0, row:4.0, icon:"💥", title:"NE particle fracture", sub:"Mechanism · negative electrode", papers:["Edge","Attia"],

<script type="module">
// Card-canvas concept graph engine (React Flow + htm). Reads a global MAP object.
// MAP = { title, subtitle, logo, focus, cols:[{title,hint,color,tint}], X?, Y0?, DY?, nodes:[...], edges:[...],
//         groups:{ label, kind:"loops"|"route", items:[{id,name,story,src,color?,kind?,nodes?}] },

//         views?:[{id,name,cols?:[{title,hint,color,tint,ids:[nodeId...]}]}],   // first view without cols = default layout
//         drill?:{ key:{ title, crumb?, from:nodeId, note?, cols, nodes, edges, groups?, glossary?, X?, Y0?, DY? } } }

// edge = [source, target, label, kind ("n"|"neg"), groupId?]

const html = htm.bind(React.createElement);

const M = window.MAP;
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const textOf = n => [n.title, n.sub, n.note, ...(n.chips || [])].join(" ");
const chipCls = c => "c" + (c.startsWith("✗") ? " warn" : c.startsWith("✓") ? " ok" : c.startsWith("⚠") ? " lim" : "");

// One "diagram" = the main map or a drill-down sub-diagram; everything derived from it lives here.
function prep(D) {
  const cols = D.cols, N = D.nodes, E = D.edges || [];
  const groups = D.groups || { label: "", kind: "route", items: [] };
  const G = groups.items || [];
  // Glossary = shared base (window.GLOSSARY_BASE) + map-specific (M.glossary) + diagram-specific; later entries override.
  const GLmap = new Map();
  [...(window.GLOSSARY_BASE || []), ...(M.glossary || []), ...(D !== M ? D.glossary || [] : [])].forEach(t => GLmap.set(t.term, t));
  const GLre = [...GLmap.values()].map(t => ({ t, re: new RegExp("(^|[^A-Za-z0-9])(" + [t.term, ...(t.aka || [])].map(esc).join("|") + ")(?![A-Za-z0-9])", t.cs ? "" : "i") }));
  const termsFor = n => GLre.filter(({ re }) => re.test(textOf(n))).map(({ t }) => t);
  const used = new Set(); N.forEach(n => termsFor(n).forEach(t => used.add(t.term)));
  return {
    D, cols, N, E, G, groups, isRoute: groups.kind === "route", termsFor,
    X: D.X || cols.map((_, i) => i * 330), Y0: D.Y0 ?? M.Y0 ?? 70, DY: D.DY ?? M.DY ?? 128,
    byId: Object.fromEntries(N.map(n => [n.id, n])), gOf: Object.fromEntries(G.map(g => [g.id, g])),
    GL: [...GLmap.values()].filter(t => used.has(t.term)).sort((a, b) => a.term.localeCompare(b.term)),
  };
}
const MAIN = prep(M);
const DR = Object.fromEntries(Object.entries(M.drill || {}).map(([k, D]) => [k, prep(D)]));

function layoutFor(dg, view) {

}

// Initial state from the hash.

  const [sel, setSel] = useState(H_SEL);

    if (nd.type === "header") return { ...nd, hidden: !!hidden[hk + nd.data.i] };
    let cls = "";
    if (hood) cls = nd.id === sel ? "focus" : hood.has(nd.id) ? "" : "dim";
    else if (gSet) cls = gSet.has(nd.id) ? "" : "dim";
    else if (hits) cls = hits.has(nd.id) ? "hit" : "dim";
    const n = nd.data.n;
    return { ...nd, hidden: !visible(nd.id), data: { ...nd.data, cls, tint: dg.cols[n.col].tint, drill: !drill && !!drillFrom[n.id] } };
  });

  const g = gOf[grp];
  const edges = E.filter(([a, b]) => visible(a) && visible(b)).map((e, i) => {
    const [a, b, label, kind, l] = e;
    const [sh, th] = handlesFor(a, b, lay);
    const inHood = hood && (a === sel || b === sel);
    const inG = g && edgeInGroup(e, g, gSet);
    const active = inHood || inG;
    const faded = (hood && !inHood) || (g && !inG) || (hits && !(hits.has(a) && hits.has(b)));
    const gc = g && (g.color || "#1f2328");
    const color = inG ? gc : kind === "neg" ? "#2b8a8a" : active ? "#1f2328" : "#b9bec5";
    return {
      id: "e" + i, source: a, target: b, sourceHandle: sh, targetHandle: th, type: "default",
      label: active && label ? label : undefined, labelBgPadding: [4, 2], labelBgBorderRadius: 4, animated: !!active,
      style: { stroke: color, strokeWidth: active ? 2.4 : 1.2, opacity: faded ? 0.07 : active ? 1 : (showAll ? 0.6 : 0.13),
               strokeDasharray: kind === "neg" ? "5 4" : undefined },
      markerEnd: { type: MarkerType.ArrowClosed, color, width: 16, height: 16 }, zIndex: active ? 10 : 0,
    };
  });

  const pick = id => { setGrp(null); setSel(id); };
  useEffect(() => { const t = setTimeout(fit, 60); return () => clearTimeout(t); }, [hidden, leftOpen, rightOpen, drill]);
  // Keep the hash in sync with view / drill (only after the first render, so initial #nodeId links survive).
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    const h = drill ? "drill=" + drill : view !== VIEW0 ? "view=" + view : "";
    history.replaceState(null, "", location.pathname + location.search + (h ? "#" + h : ""));
  }, [view, drill]);

  // Switch view: animate cards from where they are to the new layout, then fit.
  const switchView = id => {
    if (id === view || drill) return;
    const lay2 = layoutFor(MAIN, viewOf(id)), target = buildNodes(MAIN, lay2);
    const cur = Object.fromEntries(nodes.map(n => [n.id, n.position]));
    const vis0 = id0 => lay.colOf[id0] !== undefined;
    setView(id);
    const t0 = performance.now(), dur = 480, token = ++anim.current;
    let done = false;
    const finish = () => { if (done || token !== anim.current) return; done = true; setNodes(target); refit(); };
    const step = now => {
      if (done || token !== anim.current) return;
      const k = Math.min(1, (now - t0) / dur), e = ease(k);
      if (k >= 1) return finish();
      setNodes(target.map(n => {
        const a = cur[n.id];
        if (n.type === "header" || !a || !vis0(n.id)) return n;
        return { ...n, position: { x: a.x + (n.position.x - a.x) * e, y: a.y + (n.position.y - a.y) * e } };
      }));
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(finish, dur + 120); // rAF can be paused (background tab / headless); always land on the final layout
  };
  const openDrill = k => {
    anim.current++;
    const d2 = k ? DR[k] : MAIN;
    setSel(k ? null : M.drill[drill]?.from || null); setGrp(null); setQ("");
    setDrill(k);
    setNodes(buildNodes(d2, layoutFor(d2, k ? null : viewOf(view))));
  };

  const sn = sel && byId[sel];
  const ins = sn ? E.filter(e => e[1] === sel) : [], outs = sn ? E.filter(e => e[0] === sel) : [];
  const L = (e, other) => html`<div className="link" key=${e[0] + e[1]} onClick=${() => pick(other)}>
      <span>${byId[other].icon}</span><span className="ln">${byId[other].title}</span>
      ${e[2] && html`<span className="lr">— ${e[2]}</span>`}
      ${e[4] && gOf[e[4]] && html`<span className="loop"><span className="tag" style=${{ background: gOf[e[4]].color }}>${e[4]}</span></span>`}
    </div>`;
  const tagOf = (it, idx) => isRoute
    ? html`<span className="num">${idx + 1}</span>`
    : html`<span className="tag" style=${{ background: it.color }}>${it.id}</span>`;
  const DD = drill && M.drill[drill];
  const snDrill = sn && !drill && drillFrom[sn.id];

  return html`<div className="app"><div className="shell">
    <aside className=${"side" + (leftOpen ? "" : " closed")}>
      <button className="fold" title="Hide panel" onClick=${() => setLeftOpen(false)}>«</button>
      <div className="brand"><div className="logo">${M.logo}</div><div><b>${M.title}</b><span>${M.subtitle}</span></div></div>
      <input className="search" placeholder="Find a node" value=${q} onInput=${e => { setQ(e.target.value); setSel(null); setGrp(null); }} />
      ${DD ? html`<div className="focusq drillq">🔍 ${DD.title}
          <button className="pbtn" style=${{ marginTop: 8, display: "block" }} onClick=${() => openDrill(null)}>← Back to the main map</button></div>`
        : html`<div className="focusq">❓ ${M.focus}</div>${M.answer ? html`<div className="answerq">💡 ${M.answer}</div>` : null}`}
      <div className="sec-h"><span>Layers</span><span>${N.filter(n => lay.colOf[n.id] !== undefined).length}</span></div>
      ${LC.map((c, i) => html`<div key=${hk + i} className=${"row " + (hidden[hk + i] ? "off" : "")} onClick=${() => setHidden(h => ({ ...h, [hk + i]: !h[hk + i] }))}>
          <span className="dot" style=${{ background: c.color }}></span>${shortTitle(c.title)}<span className="cnt">${N.filter(n => lay.colOf[n.id] === i).length}</span></div>`)}
      ${G.length > 0 && html`<div className="sec-h"><span>${dg.groups.label}</span><span>${G.length}</span></div>`}
      ${G.map((it, idx) => html`<div key=${it.id} className=${"row loop " + (grp === it.id ? "on" : "")}
          onClick=${() => { setSel(null); setQ(""); setGrp(grp === it.id ? null : it.id); }}>
          <div className="lt">${tagOf(it, idx)}${it.name}</div><div className="ls">${it.story}</div></div>`)}
    </aside>

    <main className="canvas">
      <div className="topbar">
        ${!leftOpen && html`<button className="btn ghost" title="Show side panel" onClick=${() => setLeftOpen(true)}>☰ ${M.title}</button>`}
        ${DD && html`<span className="crumb"><a onClick=${() => openDrill(null)}>${M.title}</a><i>›</i><b>${crumbOf(drill)}</b></span>`}
        ${VIEWS && !drill && html`<span className="seg">${VIEWS.map(v => html`<button key=${v.id} className=${v.id === view ? "on" : ""} onClick=${() => switchView(v.id)}>${v.name}</button>`)}</span>`}
        <span className="chip"><b>${N.filter(n => lay.colOf[n.id] !== undefined).length}</b> concepts · <b>${E.length}</b> links</span>
        ${(sel || grp || q) && html`<button className="btn ghost" onClick=${() => { setSel(null); setGrp(null); setQ(""); }}>✕ Clear</button>`}
        <button className="btn ghost" style=${{ marginLeft: "auto" }} onClick=${() => setShowAll(v => !v)}>${showAll ? "🔇 Quiet links" : "🕸️ Show all links"}</button>
        <button className="btn" style=${{ marginLeft: 0 }} onClick=${fit}>⤢ Fit</button>
        ${!rightOpen && html`<button className="btn ghost" style=${{ marginLeft: 0 }} title="Show details" onClick=${() => setRightOpen(true)}>ⓘ Details</button>`}
      </div>
      <${ReactFlow} nodes=${shownNodes} edges=${edges} nodeTypes=${nodeTypes} onNodesChange=${onNodesChange}
        onNodeClick=${(_, n) => n.type === "card" && pick(n.id === sel ? null : n.id)} onPaneClick=${() => setSel(null)}
        onNodeDoubleClick=${(_, n) => !drill && drillFrom[n.id] && openDrill(drillFrom[n.id])}
        fitView fitViewOptions=${{ padding: 0.08 }} minZoom=${0.2} maxZoom=${2} nodesConnectable=${false} zoomOnDoubleClick=${false}
        proOptions=${{ hideAttribution: true }}>
        <${Background} variant="dots" gap=${18} size=${1.2} color="#d9d6cf" />
        <${Controls} showInteractive=${false} position="bottom-right" />
      </${ReactFlow}>
    </main>

    <aside className=${"detail" + (rightOpen ? "" : " closed")}>
      <button className="fold r" title="Hide panel" onClick=${() => setRightOpen(false)}>»</button>
      ${sn ? html`<div>
          <div className="kicker"><span className="dot" style=${{ display: "inline-block", background: dg.cols[sn.col].color, marginRight: 6 }}></span>${shortTitle(dg.cols[sn.col].title)}</div>
          <h2>${sn.icon} ${sn.title}</h2>
          <div className="muted">${sn.sub}</div>
          ${snDrill && html`<button className="pbtn on drillbtn" onClick=${() => openDrill(snDrill)}>🔍 Open diagram: ${crumbOf(snDrill)}</button>`}
          <p>${sn.note}</p>
          ${sn.chips && html`<div className="chips">${sn.chips.map(c => html`<span key=${c} className=${chipCls(c)}>${c}</span>`)}</div>`}
          ${dg.termsFor(sn).length > 0 && html`<div className="box terms"><h4>📖 Terms</h4>${dg.termsFor(sn).map(t => html`<div key=${t.term} className="term"><b>${t.term}</b> — ${t.def}</div>`)}</div>`}
          ${sn.rq && html`<div className="box rq"><h4>🎯 For our review</h4>${sn.rq}</div>`}
          ${ins.length > 0 && html`<div className="box"><h4>Fed by</h4>${ins.map(e => L(e, e[0]))}</div>`}
          ${outs.length > 0 && html`<div className="box"><h4>Leads to</h4>${outs.map(e => L(e, e[1]))}</div>`}
          <div className="box"><h4>📄 Where in the paper</h4>${sn.src.map(s => html`<div key=${s} className="src">• ${s}</div>`)}</div>
        </div>`
      : g ? html`<div>
          <div className="kicker">${isRoute ? "Read-together route · step " + (G.indexOf(g) + 1) + " of " + G.length : g.kind === "B" ? "Balancing loop (slows itself)" : "Reinforcing loop (vicious circle)"}</div>
          <h2>${g.name}</h2>
          <p>${g.story}</p>
          ${g.detail && html`<p className="muted">${g.detail}</p>`}
          <div className="box"><h4>📄 Where</h4><div className="src">${g.src}</div></div>
          ${isRoute && html`<div className="pill">
            ${G.indexOf(g) > 0 && html`<button className="pbtn" onClick=${() => setGrp(G[G.indexOf(g) - 1].id)}>← Back</button>`}
            ${G.indexOf(g) < G.length - 1 && html`<button className="pbtn on" onClick=${() => setGrp(G[G.indexOf(g) + 1].id)}>Next step →</button>`}
          </div>`}
        </div>`
      : DD ? html`<div>
          <div className="kicker">Detailed diagram · zoomed in from “${MAIN.byId[DD.from]?.title || DD.from}”</div>
          <h2>🔍 ${DD.title}</h2>
          ${DD.note && html`<p className="muted">${DD.note}</p>`}
          <div className="box"><h4>Try</h4>
            <div>• <b>Click a card</b> to trace what feeds it and what it feeds</div>
            <div>• <b>${M.title} ›</b> in the top bar takes you back</div></div>
          ${dg.GL.length > 0 && html`<details className="box gloss" open><summary><h4 style=${{ display: "inline" }}>📖 Glossary (${dg.GL.length})</h4></summary>
            ${dg.GL.map(t => html`<div key=${t.term} className="term"><b>${t.term}</b> — ${t.def}</div>`)}</details>`}
          <button className="pbtn" onClick=${() => openDrill(null)}>← Back to the main map</button>
        </div>`
      : html`<div>
          <h2 style=${{ marginTop: 0 }}>How to read</h2>
          ${M.howto.map((t, i) => html`<p key=${i} className="muted">${t}</p>`)}
          <div className="box"><h4>Try</h4>
            <div>• <b>Click a card</b> to trace what feeds it and what it feeds</div>
            ${G.length > 0 && html`<div>• <b>${isRoute ? "Click step 1" : "Click a loop"}</b> on the left${isRoute ? " and follow Next →" : " to light it up"}</div>`}
            ${VIEWS && html`<div>• <b>Switch view</b> in the top bar to regroup the same cards</div>`}
            ${M.drill && html`<div>• Cards with <b>🔍</b> open a detailed diagram</div>`}
            <div>• Hide layers to simplify; drag cards freely</div></div>
          <div className="box"><h4>Legend</h4><div className="legend">
            ${M.legend.map(([sym, txt], i) => html`<${React.Fragment} key=${i}><span dangerouslySetInnerHTML=${{ __html: sym }}></span><span>${txt}</span></${React.Fragment}>`)}
          </div></div>
          <details className="box gloss"><summary><h4 style=${{ display: "inline" }}>📖 Glossary (${MAIN.GL.length})</h4></summary>
            ${MAIN.GL.map(t => html`<div key=${t.term} className="term"><b>${t.term}</b> — ${t.def}</div>`)}</details>
          <div className="box"><h4>Sources</h4>${M.sources.map((s, i) => html`<div key=${i} className="src">${s}</div>`)}</div>
        </div>`}
    </aside>
  </div></div>`;
}
createRoot(document.getElementById("root")).render(html`<${ReactFlowProvider}><${App} /></${ReactFlowProvider}>`);

</script>
</body>
</html>
